services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aerotrack
      POSTGRES_USER: aerotrack
      POSTGRES_PASSWORD: aerotrack
    ports: ["5432:5432"]
    volumes: [aerotrack_data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U aerotrack"], interval: 5s, timeout: 5s, retries: 10}
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://aerotrack:aerotrack@postgres:5432/aerotrack
      DEMO_MODE: "true"
      FRONTEND_URL: http://localhost:5173
    ports: ["8000:8000"]
    depends_on: {postgres: {condition: service_healthy}}
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
  frontend:
    build: {context: ./frontend, args: {VITE_API_URL: http://localhost:8000}}
    ports: ["5173:80"]
    depends_on: [backend]
volumes: {aerotrack_data: {}}
